# Render Blueprint — deploy backend FastWork dengan 1 klik:
# Render Dashboard > New > Blueprint > pilih repo ini.
services:
  - type: web
    name: fastwork-backend
    runtime: docker          # Dockerfile backend sudah menginstal font DejaVu (wajib untuk /translate-map)
    rootDir: backend         # WAJIB: monorepo — kode FastAPI ada di subfolder backend/
    plan: free
    healthCheckPath: /health
    # Setelah URL Netlify frontend diketahui, tambahkan env ini di Render
    # (ganti dengan URL Netlify asli Anda):
    envVars:
      - key: CORS_ORIGINS
        sync: false
